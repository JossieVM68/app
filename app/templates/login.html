{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth">
  <div class="card auth-card">
    <div class="auth-logo">🌱</div>
    <h1>¡Hola, Josefina!</h1>
    <p class="muted">Entra a tu buscador de empleo personal.</p>
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Contraseña<input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <button class="btn primary full">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
