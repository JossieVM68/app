name: Mantener la app despierta
# Solo de 5 a 8 a.m. (hora de Chicago), cuando corre la búsqueda diaria.
# Así Mi Búsqueda y Mi Tutoría juntas no pasan las 750 horas gratis de Render.
on:
  schedule:
    - cron: "*/10 10-13 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -fsS --max-time 90 https://mi-busqueda-josefina.onrender.com/healthz || true
